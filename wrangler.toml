# Resolve — Cloudflare Worker (Workers Free plan; commercial use permitted).
# Secrets are NEVER here: `wrangler secret put <NAME>` (see .env.example).
name = "resolve"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[placement]
mode = "smart"

# Three cron triggers (Free allows 5 per account); each is its own invocation with its own 50 subrequests.
# Routing and per-invocation budgets: src/jobs/schedule.ts (tests/schedule.test.ts checks this list against it).
#   every minute  -> worker_liveness row + dispatch (select_due_watches) check, a ping of the Limitless lifecycle
#                    listener (one Durable Object request), then the channel poster (pending commits and reveals, the
#                    legs of an event as one message, at most 15 messages a minute)
#   every 5 min   -> webhook delivery drain (cap 5), then the USDC deposit scan
#   every 10 min  -> pg_net dispatch-failure count, then reconcile shadow verdicts against official outcomes
[triggers]
crons = ["* * * * *", "*/5 * * * *", "*/10 * * * *"]

# The Limitless lifecycle listener (src/jobs/limitless-ws.ts): ONE instance, named "limitless-lifecycle", holding an
# outbound websocket 24/7 = ~10,800 GB-s a day at 128 MB. Workers Free includes 13,000 GB-s a day PER ACCOUNT (shared with
# every other Worker on the account, OilFlow included; past it every Durable Object on the account fails until 00:00 UTC);
# Workers Paid includes 400,000 GB-s a month (~328,000 used). A deploy restarts it; its alarm or the every-minute cron
# ping reconnects it within about a minute. Switch: LIMITLESS_WS_ENABLED in [vars], only "1" runs it. It ships "0" until
# Workers Paid is active (or account-wide DO duration is checked) and the workerd websocket path is verified; turn it on
# in its own deploy and run the post-deploy check in docs/runbooks/limitless-recorder.md.
[[durable_objects.bindings]]
name = "LIMITLESS_WS"
class_name = "LimitlessListener"

[[migrations]]
tag = "v1-limitless-listener"
new_sqlite_classes = ["LimitlessListener"]

[[r2_buckets]]
binding = "RAW"
bucket_name = "resolve-raw"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "resolve-backups"

[vars]
JEV_MODEL = "jev-1.13.0"
JEV_RPM_LIMIT = "1200"
JEV_USD_PER_MTOK = "0.042"
JEV_TIMEOUT_MS = "2500"
JEV_PAID_ROUTES_ENABLED = "0"
JEV_DAILY_USD_CEILING = "1.00"
THRESHOLDS_VERSION = "v1"
SCHEMA_VERSION = "1"
CREDITS_PER_USDC = "100"
USDC_BASE_CONTRACT = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
BASE_FALLBACK_HTTP_URL = "https://mainnet.base.org"
BASE_LOGS_HTTP_URL = "https://mainnet.base.org"
SOLANA_FALLBACK_HTTP_URL = "https://api.mainnet-beta.solana.com"
RESOLVE_BOT_UA = "ResolveBot/1.0 (+https://resolve.rafaemush.workers.dev/bot)"
LIMITLESS_WS_ENABLED = "1"
# Evaluation keys the request form issues on the spot per UTC day (src/api/evaluation-key.ts). Past it, and when it is
# "0", the form stores the request and alerts the operator, who answers by email. Not a whole number from 0 to 1000 = 0.
REQUEST_KEY_DAILY_CAP = "25"
# Card checkout through Whop (src/billing/whop.ts). Only "1" opens checkouts and shows the /pricing form; while it is
# "0", POST /v1/billing/checkout answers 503 and the webhook (POST /webhooks/whop) still verifies and records, so a test
# event from the Whop dashboard is answered. The plan ids are the Whop plans (plan_...) of the $20 pack (2,000 credits,
# card only), the $50 pack (5,000 credits) and the $250 pack (27,500 credits): any one empty = checkout refuses, and a
# payment on an unknown plan answers 503 for Whop to retry once they are set only when it names a Resolve tenant in its
# metadata (a checkout Resolve opened); any other (a dashboard test event, another product) is answered 200 and
# alerted, so the webhook is never failed into being disabled. Set every plan id before the checkout is switched on.
# WHOP_SANDBOX "1" points every Whop call at the sandbox. WHOP_API_KEY and WHOP_WEBHOOK_SECRET are secrets (wrangler
# secret put), never here.
WHOP_CHECKOUT_ENABLED = "1"
WHOP_PLAN_ID_20 = "plan_PNgCSGmXG38KW"
WHOP_PLAN_ID_50 = "plan_XsiHbMZVNGoca"
WHOP_PLAN_ID_250 = "plan_NHZHY3hkYrT2J"
WHOP_SANDBOX = "0"
# Only "1" lets GET /v1/payments/address answer the USDC receiving address. Anything else answers 503 "USDC deposits are
# not offered", and no answer (the 402 of POST /v1/resolve, the credits.low event) ever points a tenant to that address:
# no third-party USDC is solicited. The deposit scan and the founder's own wallet test are unchanged: they read
# USDC_RECEIVING_ADDRESS (set outside this file), not this switch.
USDC_DEPOSITS_OFFERED = "0"
