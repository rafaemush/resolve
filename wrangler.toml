# Resolve — Cloudflare Worker (Workers Free plan; commercial use permitted).
# Secrets are NEVER here: `wrangler secret put <NAME>` (see .env.example).
name = "resolve"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[placement]
mode = "smart"

# Two cron triggers (Free allows 5 per account):
#   every minute  -> liveness row + webhook delivery drain
#   every 10 min  -> reconcile shadow verdicts against official outcomes
[triggers]
crons = ["* * * * *", "*/10 * * * *"]

[[r2_buckets]]
binding = "RAW"
bucket_name = "resolve-raw"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "resolve-backups"

[vars]
JEV_MODEL = "jev-1.13.0"
JEV_RPM_LIMIT = "1200"
JEV_USD_PER_MTOK = "0.042"
JEV_TIMEOUT_MS = "2500"
JEV_PAID_ROUTES_ENABLED = "0"
JEV_DAILY_USD_CEILING = "1.00"
THRESHOLDS_VERSION = "v1"
SCHEMA_VERSION = "1"
CREDITS_PER_USDC = "100"
USDC_BASE_CONTRACT = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
BASE_FALLBACK_HTTP_URL = "https://mainnet.base.org"
SOLANA_FALLBACK_HTTP_URL = "https://api.mainnet-beta.solana.com"
RESOLVE_BOT_UA = "ResolveBot/1.0 (+https://resolve.example/bot)"
